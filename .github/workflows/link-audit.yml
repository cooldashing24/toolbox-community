name: Post-Deploy Link & Route Audit

on:
  # Sent by cooldashing24/toolbox deploy-hostinger.yml after a successful production deploy
  repository_dispatch:
    types: [production-deployed]
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'

jobs:
  audit-links:
    name: Verify Web Workbench & Blog Route Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # lychee is a Rust binary, not an npm package (npm "lychee" is an unrelated library)
      - name: Run Markdown Link Integrity Crawler
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --verbose
            --user-agent "ToolboxLinkAuditBot/1.0 (+https://toolbox.vishnudigital.com)"
            --accept "200,206,301,302,307,308"
            --timeout 15
            --max-retries 3
            --exclude "https://github.com/cooldashing24/toolbox-community/.*"
            README.md
            'docs/**/*.md'
