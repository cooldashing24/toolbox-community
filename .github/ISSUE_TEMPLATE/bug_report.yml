name: 🐛 Bug Report
description: Report an issue, rendering error, or edge case in a Toolbox in-browser utility
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Because Toolbox runs 100% client-side in browser RAM, environment details (browser engine, OS version, DevTools console) are vital for reproducing bugs.
  - type: input
    id: tool_url
    attributes:
      label: Affected Tool URL
      placeholder: e.g., https://toolbox.vishnudigital.com/jwt-decoder
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser & Operating System
      placeholder: e.g., Chrome 130 on macOS Sequoia 15.1 / Firefox 132 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What happened instead? Include exact error messages or unexpected outputs.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: |
        1. Go to '...'
        2. Enter input '...'
        3. Click '...'
        4. See error
      placeholder: |
        1. Navigate to https://toolbox.vishnudigital.com/jwt-decoder
        2. Paste an RFC 7519 token with nested JSON claims
        3. Observe syntax warning
    validations:
      required: true
  - type: textarea
    id: sample_data
    attributes:
      label: Sanitized Reproduction Payload
      description: Please provide a minimal test vector. WARNING: DO NOT submit actual production secrets, passwords, or PII.
      placeholder: '{"sub": "user_123", "role": "admin"}'
    validations:
      required: false
  - type: textarea
    id: console_logs
    attributes:
      label: Browser Console Logs
      description: Relevant output from Chrome/Firefox DevTools Console (F12).
    validations:
      required: false
  - type: checkboxes
    id: privacy_verification
    attributes:
      label: Privacy & Data Protection Verification
      options:
        - label: "I confirm that no confidential keys, credentials, or proprietary PII are included in this report."
          required: true
